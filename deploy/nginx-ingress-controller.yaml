  #       - path: /rsvp/allrsvps
  #         pathType: Prefix
  #         backend:
  #           service:
  #             name: rsvpbackend
  #             port:
  #               number: 8090
  #       - path: /rsvp/saversvp
  #         pathType: Prefix
  #         backend:
  #           service:
  #             name: rsvpbackend
  #             port:
  #               number: 8090
