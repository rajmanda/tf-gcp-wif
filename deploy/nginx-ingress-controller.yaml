apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rsvp-ingress
  namespace: kalyanam
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"  # Force HTTPS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - rajmanda-dev.com
        - www.rajmanda-dev.com
        - eureka.rajmanda-dev.com  # Add your Eureka subdomain here
        - shravanikalyanam.com
        - www.shravanikalyanam.com
      secretName: rajmanda-dev-letsencrypt-prod-tls
  ingressClassName: nginx  # Set your ingress class here
  rules:
    - host: shravanikalyanam.com
      http:
        paths:
          - path: /upload/picture-upload
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090 
          - path: /upload/picture-upload
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090                                 
          - path: /admins/alladmins
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090        
          - path: /rsvp/allrsvps
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /rsvp/saversvp
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/all-gala-events
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/save-gala-event
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/delete-gala-event
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/update-gala-event
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090                   
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kalyanam
                port:
                  number: 80
    - host: rajmanda-dev.com
      http:
        paths:
          - path: /admins/alladmins
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090        
          - path: /rsvp/allrsvps
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /rsvp/saversvp
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/all-gala-events
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/save-gala-event
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/delete-gala-event
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090
          - path: /gala-event/update-gala-event
            pathType: Prefix
            backend:
              service:
                name: rsvpbackend
                port:
                  number: 8090                   
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kalyanam
                port:
                  number: 80
---
